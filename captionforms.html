<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創作研究部 作品登録フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/line-seed-jp@1.0.1/dist/line-seed-jp.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"LINE Seed JP"', 'sans-serif'],
                    },
                    colors: {
                        souken: {
                            pink: '#E3869B',
                            pinkDark: '#C85A75', /* WCAG確保用 */
                            purple: '#9D72A8',
                            indigo: '#5B59A7',
                            bg: '#FFF5F8',
                            text: '#4A3B4E',
                            'btn-gradient-start': '#C85A75',
                            'btn-gradient-end': '#5B59A7',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'LINE Seed JP', sans-serif;
            background-color: #FFF5F8; /* かわいい極薄ピンク */
            color: #4A3B4E; /* なじみの良い濃い紫 */
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #84919E;
            margin-top: 0.25rem;
            font-size: 1rem;
            background-color: white;
            color: #222222;
        }
        .form-input:focus {
            outline: none;
            border-color: #E3869B;
            box-shadow: 0 0 0 2px rgba(227, 134, 155, 0.2);
        }
        label {
            font-size: 0.875rem;
            font-weight: 700;
            color: #4A3B4E;
            display: block;
            margin-top: 1rem;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div class="flex-1 p-4 md:p-8">
        <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-pink-100">
            <!-- ロゴのグラデーションを再現したヘッダー -->
            <div class="bg-gradient-to-r from-souken-pink via-souken-purple to-souken-indigo p-6 text-white text-center shadow-inner">
                <h1 class="text-2xl font-bold drop-shadow-md">作品登録フォーム</h1>
                <p class="text-sm text-pink-100 mt-1 drop-shadow">創作研究部 キャプション・名札用データ提出</p>
            </div>

            <form id="submission-form" class="p-6 md:p-8">
                <!-- 共通情報 -->
                <div class="mb-8 pb-6 border-b border-pink-100">
                    <h2 class="text-lg font-bold text-souken-indigo mb-4 flex items-center gap-2">
                        <span class="bg-pink-50 p-1.5 rounded-lg border border-pink-200 shadow-sm text-sm">📋</span> 共通情報
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label>イベント名</label>
                            <input type="text" id="eventName" value="第66回狭丘祭（2026年度）" class="form-input">
                        </div>
                        <div>
                            <label>開催日</label>
                            <input type="text" id="eventDate" value="令和8年9月5日（土）・6日（日）" class="form-input">
                        </div>
                        <div>
                            <label>制作年</label>
                            <input type="text" id="year" value="2026" class="form-input">
                        </div>
                    </div>
                </div>

                <!-- 作品情報 -->
                <div class="mb-8">
                    <h2 class="text-lg font-bold text-souken-indigo mb-4 flex items-center gap-2">
                        <span class="bg-purple-50 p-1.5 rounded-lg border border-purple-200 shadow-sm text-sm">🎨</span> 作品・作者情報
                    </h2>
                    
                    <label>作品ID <span class="text-xs font-normal text-gray-500">※割り当てられている場合のみ</span></label>
                    <input type="text" id="workId" placeholder="A-01" class="form-input">

                    <label>作品名 <span class="text-cud-red">*</span></label>
                    <input type="text" id="title" placeholder="星月夜の夢" required class="form-input font-bold">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label>作者名 (本名) <span class="text-cud-red">*</span></label>
                            <input type="text" id="authorName" placeholder="狭山 太郎" required class="form-input">
                        </div>
                        <div>
                            <label>ローマ字表記 <span class="text-cud-red">*</span></label>
                            <input type="text" id="authorRomaji" placeholder="Taro Sayama" required class="form-input">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label>ペンネーム (PN)</label>
                            <input type="text" id="penName" placeholder="サヤタロ" class="form-input">
                        </div>
                        <div>
                            <label>学年・所属 <span class="text-cud-red">*</span></label>
                            <input type="text" id="schoolGrade" placeholder="高等学校 2年A組" required class="form-input">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label>画材 <span class="text-cud-red">*</span></label>
                            <input type="text" id="medium" placeholder="デジタル / アクリル 等" required class="form-input">
                        </div>
                        <div>
                            <label>サイズ <span class="text-cud-red">*</span></label>
                            <input type="text" id="size" placeholder="A3 / B4 等" required class="form-input">
                        </div>
                    </div>

                    <label>備考 (裏面ラベル用)</label>
                    <input type="text" id="remarks" placeholder="表紙用 / 返却希望 等" class="form-input">

                    <label>制作コメント (展示キャプション用)</label>
                    <textarea id="comment" rows="4" placeholder="作品に込めた思い、こだわったポイントなどを自由にお書きください。" class="form-input"></textarea>
                </div>

                <!-- 提出ボタン -->
                <div class="mt-8">
                    <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-souken-btn-gradient-start to-souken-btn-gradient-end hover:from-souken-pinkDark hover:to-souken-indigo text-white font-bold py-4 rounded-2xl shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300 text-lg flex justify-center items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                        この内容で提出する
                    </button>
                    <div id="status-message" class="mt-4 text-center font-bold text-sm h-6"></div>
                </div>
            </form>
        </div>
    </div>

    <!-- ダークプラム色のフッター -->
    <footer class="bg-[#3A2B3E] text-white py-3 px-4 sm:px-6 flex justify-between items-center text-xs w-full shrink-0 z-50 border-t border-purple-900">
        <!-- 左端 -->
        <div class="flex items-center gap-4">
            <div class="h-10 w-auto flex items-center justify-center">
                <img src="endologo-white.svg" onerror="this.src='https://placehold.co/80x40/222222/ffffff?text=ENDO'" alt="Endo Logo" class="h-full object-contain max-w-[80px]">
            </div>
        </div>
        
        <!-- 右端 -->
        <div class="flex items-center gap-4 text-right">
            <div class="flex flex-col text-gray-300">
                <span class="font-bold tracking-wider text-[9px] sm:text-[10px] text-white">System Architect: HIROYUKI ENDO</span>
                <span class="text-[8px] sm:text-[9px] text-pink-200">© 2026 Midnight Express Computational Archives</span>
            </div>
            <div class="h-10 w-auto flex items-center justify-center">
                <img src="mecalogo-white.svg" onerror="this.src='https://placehold.co/80x40/222222/ffffff?text=MECA'" alt="MECA Logo" class="h-full object-contain max-w-[80px]">
            </div>
        </div>
    </footer>

    <script>
        // フォーム送信処理 (async/await を追加した完全版)
        document.getElementById('submission-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const statusDiv = document.getElementById('status-message');
            const gasUrl = 'https://script.google.com/macros/s/AKfycbzm1PgvvcVz0s7KGIQzxGl7cs0I8YNrjvvyc8VvxUiftD_WvmKp7BX9UMGF4tjoEYG9_A/exec';

            // データ収集
            const formData = {
                eventName: document.getElementById('eventName').value,
                eventDate: document.getElementById('eventDate').value,
                year: document.getElementById('year').value,
                workId: document.getElementById('workId').value,
                title: document.getElementById('title').value,
                authorName: document.getElementById('authorName').value,
                authorRomaji: document.getElementById('authorRomaji').value,
                penName: document.getElementById('penName').value,
                schoolGrade: document.getElementById('schoolGrade').value,
                medium: document.getElementById('medium').value,
                size: document.getElementById('size').value,
                remarks: document.getElementById('remarks').value,
                comment: document.getElementById('comment').value,
            };

            // 送信中のUI変更
            btn.disabled = true;
            btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 送信中...';
            statusDiv.textContent = '';

            try {
                const response = await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors', // GASへのPOSTの基本設定
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                statusDiv.textContent = '🎉 送信が完了しました！';
                statusDiv.className = 'mt-4 text-center font-bold text-sm h-6 text-souken-pinkDark';
                
                // フォームをリセット (共通情報以外)
                document.getElementById('workId').value = '';
                document.getElementById('title').value = '';
                document.getElementById('remarks').value = '';
                document.getElementById('comment').value = '';
                
            } catch (error) {
                console.error('Error:', error);
                statusDiv.textContent = '❌ エラーが発生しました。通信環境を確認してください。';
                statusDiv.className = 'mt-4 text-center font-bold text-sm h-6 text-red-500';
            } finally {
                // ボタンの復元
                btn.disabled = false;
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg> この内容で提出する';
            }
        });
    </script>
</body>
</html>
